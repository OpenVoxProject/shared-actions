name: Build an OpenVox ezbake project

on:
  workflow_call:
    inputs:
      ref:
        description: 'Tag to build'
        required: true
        type: string
      deb_platform_list:
        description: 'A comma-separated list of deb-based platforms to build for, excluding the architecture (e.g. ubuntu-24.04,debian-12). Do not include spaces. If not provided, will use the default list of platforms supported by OpenVox Server and DB.'
        required: false
        type: string
      rpm_platform_list:
        description: 'A comma-separated list of rpm-based platforms to build for, excluding the architecture (e.g. el-9,amazon-2023). Do not include spaces. If not provided, will use the default list of platforms supported by OpenVox Server and DB.'
        required: false
        type: string
      ezbake-ref:
        description: |-
          Branch/tag from ezbake that will be used for openvoxdb/server builds.
        type: string
        required: false
      ezbake-2-ver:
        description: 'Version for the ezbake 2 build group used for older OSes.'
        type: string
        required: false
      ezbake-4-ver:
        description: 'Version for the ezbake 4 build group used for newer OSes.'
        type: string
        required: false
      branch:
        description: 'Release branch being built. Used for repo checkout and default platform list.'
        type: string
        required: false
        default: 'main'

env:
  ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
  BUCKET_NAME: ${{ secrets.S3_ARTIFACTS_BUCKET_NAME }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  # https://github.com/boto/boto3/issues/4398#issuecomment-2619946229
  AWS_REQUEST_CHECKSUM_CALCULATION: "WHEN_REQUIRED"
  AWS_RESPONSE_CHECKSUM_VALIDATION: "WHEN_REQUIRED"

jobs:
  build-ezbake-2:
    name: ezbake 2 build for legacy OSes
    runs-on: ubuntu-24.04
    timeout-minutes: 600
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - name: Checkout platform config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenVoxProject/shared-actions
          ref: ezbake4 # switch to main before merge!
          path: .shared-actions
          sparse-checkout: platforms.json
          sparse-checkout-cone-mode: false

      - name: Resolve platform lists for ezbake 2
        env:
          DEB_PLATFORMS: ${{ inputs.deb_platform_list }}
          RPM_PLATFORMS: ${{ inputs.rpm_platform_list }}
          BRANCH: ${{ inputs.branch }}
          EZBAKE_2_VER: ${{ inputs.ezbake-2-ver }}
        run: |
          EZBAKE_2_VER="${EZBAKE_2_VER:-$(jq -r --arg branch "${BRANCH}" '.[$branch]."ezbake2-version"' .shared-actions/platforms.json)}"

          echo "EZBAKE_BRANCH=${{ inputs.ezbake-ref }}" >> $GITHUB_ENV
          echo "EZBAKE_VERSION=${EZBAKE_2_VER}" >> $GITHUB_ENV
          DEB_PLATFORMS="${DEB_PLATFORMS:-$(jq -r --arg branch "${BRANCH}" '.[$branch]."ezbake2-deb" | join(",")' .shared-actions/platforms.json)}"
          echo "DEB_PLATFORMS=$DEB_PLATFORMS" >> $GITHUB_ENV
          RPM_PLATFORMS="${RPM_PLATFORMS:-$(jq -r --arg branch "${BRANCH}" '.[$branch]."ezbake2-rpm" | join(",")' .shared-actions/platforms.json)}"
          echo "RPM_PLATFORMS=$RPM_PLATFORMS" >> $GITHUB_ENV

          echo "::notice title=ezbake 2 EZBAKE_BRANCH::${{ inputs.ezbake-ref }}"
          echo "::notice title=ezbake 2 EZBAKE_VERSION::$EZBAKE_2_VER"
          echo "::notice title=ezbake 2 PLATFORMS::$DEB_PLATFORMS,$RPM_PLATFORMS"

      - name: Install Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - id: docker-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ezbake-builder.tar
          key: docker-ezbake-${{ hashFiles('Dockerfile') }}-legacy

      - name: Load or build Docker image
        run: |
          if [[ -f /tmp/ezbake-builder.tar ]]; then
            docker load -i /tmp/ezbake-builder.tar
          else
            docker build -t ezbake-builder .
            docker save ezbake-builder -o /tmp/ezbake-builder.tar
          fi

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.docker-cache.outputs.cache-hit != 'true'
        with:
          path: /tmp/ezbake-builder.tar
          key: docker-ezbake-${{ hashFiles('Dockerfile') }}-legacy

      - name: Update awscli
        run: |
          python -m pip install --upgrade awscli

      - name: Run build script
        env:
          BUILD_REF: ${{ inputs.ref }}
        run: |
          rm -rf output
          bundle exec rake "vox:build[${BUILD_REF}]"

      - name: Configure OSUOSL CA Certificate for S3
        uses: $/.github/actions/setup-osuosl-ca

      - name: Upload output to S3
        run: |
          bundle exec rake vox:upload

  build-ezbake-4:
    name: ezbake 4 build for modern OSes
    runs-on: ubuntu-24.04
    timeout-minutes: 600
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - name: Checkout platform config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenVoxProject/shared-actions
          ref: ezbake4 # switch to main before merge!
          path: .shared-actions
          sparse-checkout: platforms.json
          sparse-checkout-cone-mode: false

      - name: Resolve platform lists for ezbake 4
        env:
          DEB_PLATFORMS: ${{ inputs.deb_platform_list }}
          RPM_PLATFORMS: ${{ inputs.rpm_platform_list }}
          BRANCH: ${{ inputs.branch }}
          EZBAKE_4_VER: ${{ inputs.ezbake-4-ver }}
        run: |
          EZBAKE_4_VER="${EZBAKE_4_VER:-$(jq -r --arg branch "${BRANCH}" '.[$branch]."ezbake4-version"' .shared-actions/platforms.json)}"

          echo "EZBAKE_BRANCH=${{ inputs.ezbake-ref }}" >> $GITHUB_ENV
          echo "EZBAKE_VERSION=${EZBAKE_4_VER}" >> $GITHUB_ENV
          DEB_PLATFORMS="${DEB_PLATFORMS:-$(jq -r --arg branch "${BRANCH}" '.[$branch]."ezbake4-deb" | join(",")' .shared-actions/platforms.json)}"
          echo "DEB_PLATFORMS=$DEB_PLATFORMS" >> $GITHUB_ENV
          RPM_PLATFORMS="${RPM_PLATFORMS:-$(jq -r --arg branch "${BRANCH}" '.[$branch]."ezbake4-rpm" | join(",")' .shared-actions/platforms.json)}"
          echo "RPM_PLATFORMS=$RPM_PLATFORMS" >> $GITHUB_ENV

          echo "::notice title=ezbake 4 EZBAKE_BRANCH::${{ inputs.ezbake-ref }}"
          echo "::notice title=ezbake 4 EZBAKE_VERSION::$EZBAKE_4_VER"
          echo "::notice title=ezbake 4 PLATFORMS::$DEB_PLATFORMS,$RPM_PLATFORMS"

      - name: Install Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0'
          bundler-cache: true

      # we need to cache the container per-ezbake version because ezbake is checked out inside of that container
      - id: docker-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ezbake-builder.tar
          key: docker-ezbake-${{ hashFiles('Dockerfile') }}-modern

      - name: Load or build Docker image
        run: |
          if [[ -f /tmp/ezbake-builder.tar ]]; then
            docker load -i /tmp/ezbake-builder.tar
          else
            docker build -t ezbake-builder .
            docker save ezbake-builder -o /tmp/ezbake-builder.tar
          fi

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.docker-cache.outputs.cache-hit != 'true'
        with:
          path: /tmp/ezbake-builder.tar
          key: docker-ezbake-${{ hashFiles('Dockerfile') }}-modern

      - name: Update awscli
        run: |
          python -m pip install --upgrade awscli

      - name: Run build script
        env:
          BUILD_REF: ${{ inputs.ref }}
        run: |
          rm -rf output
          bundle exec rake "vox:build[${BUILD_REF}]"

      - name: Configure OSUOSL CA Certificate for S3
        uses: $/.github/actions/setup-osuosl-ca

      - name: Upload output to S3
        run: |
          bundle exec rake vox:upload
