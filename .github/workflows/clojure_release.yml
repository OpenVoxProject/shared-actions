---
name: Publish package to clojars.org

on:
  workflow_call:
    inputs:
      base-branch:
        description: 'The branch to release from. Leave empty for default branch.'
        type: string
        required: false
        default: ''
      java-version:
        description: 'The java version to use when building the jar.'
        type: string
        required: false
        default: '17'
      include_changelog_in_release:
        description: 'Include content from CHANGELOG.md in the release notes'
        required: false
        default: false
        type: boolean
      post-version-change:
        description: 'A shell command to run after the version in project.clj changes to the next snapshot, for example to keep a dependency on the project itself in sync. Leave empty for none.'
        type: string
        required: false
        default: ''
    outputs:
      version:
        description: 'The released version, which is also the name of the pushed tag.'
        value: ${{ jobs.release.outputs.version }}
    secrets:
      github_pat:
        # Provide a fine-grained token with the following repository permissions:
        # * Contents: Read and write
        # * Metadata: Read-only (mandatory, default)
        # * Pull requests: Read and write
        description: 'The token used to interact with GitHub'
        required: true
      ssh_private_key:
        description: 'The SSH private key used to sign commits and tags.'
        required: true
      clojars_username:
        description: 'The username for clojars.org'
        required: true
      clojars_password:
        description: 'The password for clojars.org'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    # `environment` enables better auditing and fine grained permissions
    # https://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/control-deployments
    environment: release
    if: github.repository_owner == 'OpenVoxProject'
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base-branch }}
          fetch-depth: 0
          token: ${{ secrets.github_pat }}

      - name: Setup java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          lein: 'latest'

      - name: Get and validate release version
        id: version
        shell: bash
        run: |
          coordinates="$(lein update-in :plugins conj '[lein-pprint "1.3.2"]' -- pprint :group :name :version | tr -d '"')"
          { read -r group; read -r name; read -r version; } <<< "$coordinates"

          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "::error file=project.clj::Version '$version' is a snapshot. Run the Prepare Release workflow and merge its pull request first."
            exit 1
          fi

          # Semver like release.yml, plus a fourth number for jruby-deps versions such as 10.1.2.0-1.
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2,3}(-[[:alnum:].]*[0-9])?$ ]]; then
            echo "::error file=project.clj::Version '$version' does not match expected format (semver like 9.1.0 or 9.0.0-rc2, or 10.1.2.0-1 for jruby-deps)"
            exit 1
          fi

          # The Prepare Release workflow sets the version of the next release, so the
          # snapshot after this release only has to differ from it.
          last_number="${version##*[!0-9]}"
          next_version="${version%"$last_number"}$((10#$last_number + 1))-SNAPSHOT"

          {
            echo "group=${group}"
            echo "name=${name}"
            echo "version=${version}"
            echo "next_version=${next_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup git and SSH signing
        id: git_identity
        uses: $/.github/actions/setup-git-ssh-signing
        with:
          ssh_private_key: ${{ secrets.ssh_private_key }}

      - name: Check tag doesn't already exist
        run: |
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag '${{ steps.version.outputs.version }}' already exists!"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        id: extract_notes
        if: inputs.include_changelog_in_release
        run: |
          ruby << 'EOF'
          version = "${{ steps.version.outputs.version }}"

          unless File.exist?('CHANGELOG.md')
            warn "::warning::No CHANGELOG.md found, release will use auto-generated notes only"
            File.write(ENV['GITHUB_OUTPUT'], "has_notes=false\n", mode: 'a')
            exit 0
          end

          changelog = File.read('CHANGELOG.md')

          # Match ## [VERSION]...\n then capture everything until the next ## [ or end of file
          match = changelog.match(/^## \[#{Regexp.escape(version)}\][^\n]*\n(?<notes>.+?)(?=^## \[|\z)/m)

          unless match
            warn "::warning::Could not find version #{version} in CHANGELOG.md, release will use auto-generated notes only"
            File.write(ENV['GITHUB_OUTPUT'], "has_notes=false\n", mode: 'a')
            exit 0
          end

          notes = match[:notes].strip

          if notes.empty?
            warn "::warning::Version #{version} section is empty, release will use auto-generated notes only"
            File.write(ENV['GITHUB_OUTPUT'], "has_notes=false\n", mode: 'a')
            exit 0
          end

          File.write('release_notes.md', notes)
          File.write(ENV['GITHUB_OUTPUT'], "has_notes=true\n", mode: 'a')
          puts "Extracted release notes for version #{version}"
          EOF

      # A release version can be deployed to clojars.org only once, so a rerun of a
      # run that failed after this step skips the deploy.
      - name: Publish to clojars.org
        env:
          CLOJARS_USERNAME: ${{ secrets.clojars_username }}
          CLOJARS_PASSWORD: ${{ secrets.clojars_password }}
        run: |
          group="${{ steps.version.outputs.group }}"
          name="${{ steps.version.outputs.name }}"
          version="${{ steps.version.outputs.version }}"
          if curl --fail --silent --output /dev/null "https://repo.clojars.org/${group//.//}/${name}/${version}/${name}-${version}.pom"; then
            echo "::notice::Version ${version} is already on clojars.org, skipping the deploy."
          else
            lein deploy
          fi

      - name: Create signed tag
        run: |
          git tag -s -m "Release ${{ steps.version.outputs.version }}" "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.github_pat }}
        run: |
          if [[ "${{ steps.version.outputs.version }}" =~ (alpha|beta|rc) ]]; then
            RELEASE_CHANNEL_ARGS=(--prerelease --latest=false)
          else
            RELEASE_CHANNEL_ARGS=(--latest)
          fi

          RELEASE_ARGS=(
            "${{ steps.version.outputs.version }}"
            --title "${{ steps.version.outputs.version }}"
            --generate-notes
            --verify-tag
            "${RELEASE_CHANNEL_ARGS[@]}"
          )

          if [ "${{ steps.extract_notes.outputs.has_notes }}" = "true" ]; then
            RELEASE_ARGS+=(--notes-file release_notes.md)
          fi

          gh release create "${RELEASE_ARGS[@]}"

      - name: Bump version to the next snapshot
        run: |
          lein change version set "\"${{ steps.version.outputs.next_version }}\""
          ${{ inputs.post-version-change }}

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_user_name: ${{ steps.git_identity.outputs.git_committer_name }}
          commit_user_email: ${{ steps.git_identity.outputs.git_committer_email }}
          commit_author: '${{ steps.git_identity.outputs.git_author_name }} <${{ steps.git_identity.outputs.git_author_email }}>'
          commit_message: "Version ${{ steps.version.outputs.next_version }}"
          # lein deploy leaves a pom.xml behind, and not every repository ignores it.
          file_pattern: project.clj
