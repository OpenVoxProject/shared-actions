---
name: Update openvox-sbom-tools data
description: >-
  Checks out OpenVoxProject/openvox-sbom-tools, regenerates its component
  data, and opens a pull request if anything changed.

inputs:
  github_pat:
    description: >-
      Fine-grained token with contents/pull-requests write access to
      OpenVoxProject/openvox-sbom-tools.
    required: true
  ssh_private_key:
    description: SSH private key used to sign the commit.
    required: true
  project:
    description: >-
      SBOM project to generate an SBOM for: openvox-agent, openbolt,
      openvox-server, or openvoxdb.
    required: true
  tag:
    description: Git tag of `project` to generate an SBOM for.
    required: true

runs:
  using: composite
  steps:
    - name: Checkout openvox-sbom-tools
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: OpenVoxProject/openvox-sbom-tools
        token: ${{ inputs.github_pat }}

    - name: Setup Ruby
      uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Setup git and SSH signing
      id: git_identity
      uses: $/.github/actions/setup-git-ssh-signing
      with:
        ssh_private_key: ${{ inputs.ssh_private_key }}

    - name: Update SBOM data
      shell: bash
      run: bundle exec rake vox:sbom:update_data

    - name: Generate SBOM
      shell: bash
      env:
        SBOM_PROJECT: ${{ inputs.project }}
        SBOM_TAG: ${{ inputs.tag }}
      run: bundle exec rake "vox:sbom:gen[${SBOM_PROJECT},${SBOM_TAG}]"

    - name: Detect changes
      id: changes
      shell: bash
      run: |
        if [[ -n "$(git status --porcelain)" ]]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Create pull Request
      if: steps.changes.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ inputs.github_pat }}
        signoff: true
        branch: sbom-data-update-${{ inputs.project }}-${{ inputs.tag }}
        delete-branch: true
        commit-message: "Update SBOM data for ${{ inputs.project }} ${{ inputs.tag }}"
        title: "Update SBOM data for ${{ inputs.project }} ${{ inputs.tag }}"
        body: |
          Automated SBOM data update after building ${{ inputs.project }} ${{ inputs.tag }}.
        author: '${{ steps.git_identity.outputs.git_author_name }} <${{ steps.git_identity.outputs.git_author_email }}>'
        committer: '${{ steps.git_identity.outputs.git_committer_name }} <${{ steps.git_identity.outputs.git_committer_email }}>'
